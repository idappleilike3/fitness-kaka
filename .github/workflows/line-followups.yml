name: LINE paid member follow-ups

on:
  schedule:
    # GitHub Actions schedules are UTC. These correspond to Taiwan time
    # 08:00 breakfast, 12:00 lunch, and 18:30 dinner.
    - cron: "0 0 * * *"
    - cron: "0 4 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: line-paid-member-followups
  cancel-in-progress: false

jobs:
  send-followups:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call protected follow-up endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://fitness-kaka.vercel.app/api/cron/line-followups
