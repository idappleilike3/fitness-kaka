name: Fix line router build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-line-router.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix undefined LINE user variable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/line-router.ts')
          s = p.read_text(encoding='utf-8')
          old = 'await handleImageMeal(replyToken, member.id, buf, "image/jpeg", lineUserId);'
          new = 'await handleImageMeal(replyToken, member.id, buf, "image/jpeg", userId);'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/line-router.ts
          git commit -m "fix: pass LINE user id to image analysis"
          git push
