name: Complete V10 LINE assets

on:
  push:
    paths:
      - ".github/workflows/complete-v10-line-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add existing-style welcome Flex card
        shell: bash
        run: |
          cat > src/lib/line/welcome-flex.ts <<'EOF'
          export function welcomeFlexMessage() {
            return {
              type: "flex",
              altText: "欢迎加入健身卡卡教练",
              contents: {
                type: "bubble",
                size: "mega",
                hero: {
                  type: "image",
                  url: "https://fitness-kaka.vercel.app/images/coach-portrait.png",
                  size: "full",
                  aspectRatio: "20:13",
                  aspectMode: "cover",
                  action: {
                    type: "uri",
                    uri: "https://liff.line.me/2010804832-oPIqeXjJ",
                  },
                },
                body: {
                  type: "box",
                  layout: "vertical",
                  spacing: "md",
                  backgroundColor: "#07110E",
                  contents: [
                    {
                      type: "text",
                      text: "嗨，我是卡卡",
                      weight: "bold",
                      size: "xl",
                      color: "#F4FFF9",
                    },
                    {
                      type: "text",
                      text: "不用节食，也不用每天自己算热量。拍下每一餐，我陪你完成 30 天减脂挑战。",
                      wrap: true,
                      size: "md",
                      color: "#CBE6D8",
                      lineSpacing: "5px",
                    },
                    {
                      type: "separator",
                      color: "#244D3C",
                      margin: "md",
                    },
                    {
                      type: "text",
                      text: "你可以马上试",
                      weight: "bold",
                      color: "#72E2A4",
                    },
                    {
                      type: "text",
                      text: "• 传食物照片，AI 估算热量\n• 打字告诉我吃了什么\n• 问『今天还能吃多少』看剩余",
                      wrap: true,
                      color: "#E7F5EE",
                      size: "sm",
                      lineSpacing: "5px",
                    },
                  ],
                },
                footer: {
                  type: "box",
                  layout: "vertical",
                  spacing: "sm",
                  backgroundColor: "#07110E",
                  contents: [
                    {
                      type: "button",
                      style: "primary",
                      color: "#06C755",
                      height: "sm",
                      action: {
                        type: "uri",
                        label: "开始使用卡卡",
                        uri: "https://liff.line.me/2010804832-oPIqeXjJ",
                      },
                    },
                    {
                      type: "button",
                      style: "secondary",
                      height: "sm",
                      action: {
                        type: "message",
                        label: "查看怎么用",
                        text: "怎么用",
                      },
                    },
                    {
                      type: "text",
                      text: "AI 推估可能有误差，结果非医疗诊断",
                      wrap: true,
                      align: "center",
                      color: "#82988D",
                      size: "xxs",
                      margin: "sm",
                    },
                  ],
                },
              },
            } as const;
          }
          EOF

      - name: Wire Follow event and LIFF rich-menu URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('src/services/line-router.ts')
          text = router.read_text()
          import_anchor = 'import {\n  pickNonRepeatingReply,'
          if 'welcomeFlexMessage' not in text:
              text = text.replace(
                  import_anchor,
                  'import { welcomeFlexMessage } from "@/lib/line/welcome-flex";\n' + import_anchor,
                  1,
              )

          old = '''    if (event.type === "follow") {
              // Never re-ask completed / unlocked onboarding on re-follow
              if (!member.onboarding_step) {
                await replyText(replyToken, welcomeMessage());
                return;
              }
              const cont = continueOnboardingPrompt(member.onboarding_step);
              await replyOnboarding(replyToken, {
                ...cont,
                reply: `${welcomeMessage()}\\n\\n${cont.reply}`,
              });
              return;
            }'''
          new = '''    if (event.type === "follow") {
              // Keep the approved welcome copy, but present it as the existing-style image card.
              await replyMessage(replyToken, [welcomeFlexMessage()]);
              if (member.onboarding_step) {
                const cont = continueOnboardingPrompt(member.onboarding_step);
                await replyOnboarding(replyToken, cont);
              }
              return;
            }'''
          if old not in text:
              raise SystemExit('Follow block did not match; refusing unsafe rewrite')
          text = text.replace(old, new, 1)
          router.write_text(text)

          menu = Path('scripts/setup-rich-menu.mjs')
          menu_text = menu.read_text()
          menu_text = menu_text.replace(
              'const LIFF_URL = "https://fitness-kaka.vercel.app/liff";',
              'const LIFF_URL = "https://liff.line.me/2010804832-oPIqeXjJ";',
          )
          menu.write_text(menu_text)
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit V10 LINE integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/line/welcome-flex.ts src/services/line-router.ts scripts/setup-rich-menu.mjs
          if git diff --cached --quiet; then
            echo "No code changes required"
          else
            git commit -m "feat(line): restore approved welcome card and LIFF rich menu"
            git push origin main
          fi

      - name: Publish existing six-cell Rich Menu when token is available
        shell: bash
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN secret is not configured in GitHub; website deployment remains successful and publishing is safely skipped."
            exit 0
          fi
          node scripts/setup-rich-menu.mjs
